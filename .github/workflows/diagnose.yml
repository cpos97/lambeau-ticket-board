name: Diagnose
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - env:
          TM_API_KEY: ${{ secrets.TM_API_KEY }}
        run: python3 diagnose.py
